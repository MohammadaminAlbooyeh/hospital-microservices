spring:
  application:
    name: doctor-service
  datasource:
    url: jdbc:postgresql://localhost:5432/hospital_doctor
    username: hospital
    password: hospital
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
server:
  port: 8084
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8888/eureka
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

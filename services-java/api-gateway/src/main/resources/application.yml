server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:*}
            allowed-methods: "*"
            allowed-headers: "*"
            exposed-headers: X-Correlation-Id
            allow-credentials: true
      httpclient:
        connect-timeout: 5000
        response-timeout: 30s

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8888/eureka/}
    enabled: ${EUREKA_ENABLED:true}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

hospital:
  security:
    jwt:
      secret: ${JWT_SECRET:hospital-development-secret-key-change-me-please-0123456789}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:240}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{correlationId:-}] %logger{36} - %msg%n"
  level:
    org.springframework.cloud.gateway: INFO

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8888/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

hospital:
  security:
    jwt:
      secret: ${JWT_SECRET:hospital-development-secret-key-change-me-please-0123456789}
      access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
      refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  outbox:
    topic: ${KAFKA_TOPIC:hospital.events}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{correlationId:-}] %logger{36} - %msg%n"

apiVersion: v1
kind: Secret
metadata:
  name: hospital-secrets
  namespace: {{ .Values.global.namespace }}
  labels:
    app.kubernetes.io/part-of: hospital-platform
    app.kubernetes.io/component: platform-secrets
type: Opaque
# Dev-only placeholders sourced from values.secrets. Production MUST override
# via --set-file / a sealed-secret / an ExternalSecret rather than committing
# real credentials to values files.
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}

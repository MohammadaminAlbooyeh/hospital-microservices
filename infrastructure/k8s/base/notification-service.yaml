apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  labels:
    app: notification-service
    tier: service
    app.kubernetes.io/part-of: hospital-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
        tier: service
        app.kubernetes.io/part-of: hospital-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8003"
    spec:
      containers:
        - name: notification-service
          image: hospital/notification-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8003
          envFrom:
            - configMapRef:
                name: hospital-config
            - secretRef:
                name: hospital-secrets
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: SERVICE_PORT
              value: "8003"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: hospital-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: hospital-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: hospital-config
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hospital-secrets
                  key: DB_PASSWORD
            - name: DB_NAME
              value: hospital_notification
            - name: DATABASE_URL
              value: postgresql+asyncpg://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)
            - name: KAFKA_GROUP_ID
              value: notification-service
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  labels:
    app: notification-service
    tier: service
    app.kubernetes.io/part-of: hospital-platform
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8003
      targetPort: http
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: notification-service-reminders
  labels:
    app: notification-service
    tier: cronjob
    app.kubernetes.io/part-of: hospital-platform
spec:
  # Appointment reminders are a 24h-before job; notification-service has no
  # scheduler of its own (app/workers/reminders.py), so this CronJob is the
  # trigger, POSTing to the service's admin endpoint — see
  # app/api/v1/routes.py:run_reminders. It currently posts an empty
  # appointments list: sourcing "appointments due in ~24h" (a cross-service
  # query/join against appointment-service + patient-service, kept out of
  # notification-service to respect database-per-service) is a known
  # follow-up, tracked separately from the trigger wiring itself.
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: notification-service
            tier: cronjob
        spec:
          restartPolicy: OnFailure
          containers:
            - name: trigger-reminders
              image: curlimages/curl:8.11.0
              command:
                - /bin/sh
                - -c
                - |
                  curl -fsS -X POST \
                    -H 'Content-Type: application/json' \
                    -d '{"appointments": []}' \
                    http://notification-service:8003/api/v1/notifications/internal/reminders/run
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { cpu: 100m, memory: 64Mi }

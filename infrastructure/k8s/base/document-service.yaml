apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-service
  labels:
    app: document-service
    tier: service
    app.kubernetes.io/part-of: hospital-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: document-service
  template:
    metadata:
      labels:
        app: document-service
        tier: service
        app.kubernetes.io/part-of: hospital-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8006"
    spec:
      containers:
        - name: document-service
          image: hospital/document-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8006
          envFrom:
            - configMapRef:
                name: hospital-config
            - secretRef:
                name: hospital-secrets
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: SERVICE_PORT
              value: "8006"
            - name: KAFKA_GROUP_ID
              value: document-service
            - name: DOCUMENT_STORAGE_PATH
              value: /tmp/hospital-documents
          volumeMounts:
            - name: documents
              mountPath: /tmp/hospital-documents
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: documents
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: document-service
  labels:
    app: document-service
    tier: service
    app.kubernetes.io/part-of: hospital-platform
spec:
  type: ClusterIP
  selector:
    app: document-service
  ports:
    - name: http
      port: 8006
      targetPort: http

apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics-service
  labels:
    app: analytics-service
    tier: service
    app.kubernetes.io/part-of: hospital-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: analytics-service
  template:
    metadata:
      labels:
        app: analytics-service
        tier: service
        app.kubernetes.io/part-of: hospital-platform
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8004"
    spec:
      containers:
        - name: analytics-service
          image: hospital/analytics-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8004
          envFrom:
            - configMapRef:
                name: hospital-config
            - secretRef:
                name: hospital-secrets
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: SERVICE_PORT
              value: "8004"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: hospital-config
                  key: TIMESCALE_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: hospital-config
                  key: TIMESCALE_PORT
            - name: DB_USER
              valueFrom:
                configMapKeyRef:
                  name: hospital-config
                  key: TIMESCALE_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hospital-secrets
                  key: TIMESCALE_PASSWORD
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: hospital-config
                  key: TIMESCALE_DB
            - name: DATABASE_URL
              value: postgresql+asyncpg://$(DB_USER):$(DB_PASSWORD)@$(DB_HOST):$(DB_PORT)/$(DB_NAME)
            - name: KAFKA_GROUP_ID
              value: analytics-service
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: analytics-service
  labels:
    app: analytics-service
    tier: service
    app.kubernetes.io/part-of: hospital-platform
spec:
  type: ClusterIP
  selector:
    app: analytics-service
  ports:
    - name: http
      port: 8004
      targetPort: http

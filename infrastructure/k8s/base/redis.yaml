apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
    tier: infrastructure
    app.kubernetes.io/part-of: hospital-platform
spec:
  type: ClusterIP
  selector:
    app: redis
    tier: infrastructure
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
    tier: infrastructure
    app.kubernetes.io/part-of: hospital-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
      tier: infrastructure
  template:
    metadata:
      labels:
        app: redis
        tier: infrastructure
        app.kubernetes.io/part-of: hospital-platform
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - --appendonly
            - "yes"
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: data
          emptyDir: {}

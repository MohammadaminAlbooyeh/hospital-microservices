openapi: 3.0.3
info:
  title: billing-service
  description: >
    Assembles an invoice from an encounter: consultation + labs + drugs +
    bed. Splits insurer share vs patient share. Idempotency key support is
    planned on create (docs/architecture.md §5.4); voiding and recalculation
    are explicit operations.
  version: "1.0.0"
servers:
  - url: http://localhost:8091
  - url: http://localhost:8080
    description: Via api-gateway (/api/v1/billing/**, /api/v1/invoices/**)
paths:
  /api/v1/billing/invoices:
    post:
      summary: Create an invoice
      operationId: create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvoiceRequest' }
      responses:
        '201':
          description: Invoice created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceResponse' }
    get:
      summary: List invoices
      operationId: list
      parameters:
        - name: patientId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/InvoiceStatus' }
      responses:
        '200':
          description: Matching invoices
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InvoiceResponse' }
        '400': { description: Unknown invoice status }
  /api/v1/billing/invoices/{id}:
    get:
      summary: Get an invoice by ID
      operationId: get
      parameters: [{ $ref: '#/components/parameters/InvoiceId' }]
      responses:
        '200':
          description: Invoice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceResponse' }
        '404': { description: Invoice not found }
  /api/v1/billing/invoices/{id}/void:
    post:
      summary: Void an invoice (compensating action in the payment saga)
      operationId: voidInvoice
      parameters: [{ $ref: '#/components/parameters/InvoiceId' }]
      responses:
        '200':
          description: Voided invoice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceResponse' }
  /api/v1/billing/invoices/{id}/recalculate:
    post:
      summary: Recalculate an invoice's totals and split
      operationId: recalculate
      parameters: [{ $ref: '#/components/parameters/InvoiceId' }]
      responses:
        '200':
          description: Recalculated invoice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceResponse' }
components:
  parameters:
    InvoiceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    InvoiceStatus:
      type: string
      enum: [PENDING, PAYMENT_PENDING, PARTIALLY_PAID, PAID, VOID]
    InvoiceLineCategory:
      type: string
      enum: [CONSULTATION, LAB, DRUG, BED, OTHER]
    InvoiceLineRequest:
      type: object
      required: [category, description, quantity, unitPrice]
      properties:
        category: { $ref: '#/components/schemas/InvoiceLineCategory' }
        description: { type: string }
        quantity: { type: integer, minimum: 1 }
        unitPrice: { type: number, format: double, minimum: 0 }
    InvoiceLineResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        category: { $ref: '#/components/schemas/InvoiceLineCategory' }
        description: { type: string }
        quantity: { type: integer }
        unitPrice: { type: number, format: double }
        amount: { type: number, format: double }
    CreateInvoiceRequest:
      type: object
      required: [patientId, currency, lines]
      properties:
        patientId: { type: string, format: uuid }
        encounterId: { type: string, format: uuid, nullable: true }
        currency: { type: string }
        insuranceCoveragePercent: { type: number, format: double, minimum: 0, maximum: 100, nullable: true }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/InvoiceLineRequest' }
    InvoiceResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        encounterId: { type: string, format: uuid, nullable: true }
        patientId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        currency: { type: string }
        subtotal: { type: number, format: double }
        insurerShare: { type: number, format: double }
        patientShare: { type: number, format: double }
        totalAmount: { type: number, format: double }
        insuranceCoveragePercent: { type: number, format: double, nullable: true }
        issuedAt: { type: string, format: date-time, nullable: true }
        paidAt: { type: string, format: date-time, nullable: true }
        failureReason: { type: string, nullable: true }
        lastPaymentId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lines:
          type: array
          items: { $ref: '#/components/schemas/InvoiceLineResponse' }

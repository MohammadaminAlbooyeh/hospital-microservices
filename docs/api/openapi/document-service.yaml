openapi: 3.0.3
info:
  title: document-service
  description: >
    PDF generation (invoices, discharge summaries, medical certificates) and
    OCR of uploaded documents. Generated PDFs are returned directly in the
    response and also stored, retrievable later by ID.
  version: "1.0.0"
servers:
  - url: http://localhost:8006
  - url: http://localhost:8080
    description: Via api-gateway (/api/v1/documents/**)
paths:
  /api/v1/documents/invoices:
    post:
      summary: Generate and store an invoice PDF
      operationId: create_invoice
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceRequest' }
      responses:
        '201':
          description: Invoice PDF (application/pdf, X-Document-Id header carries the stored document ID)
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /api/v1/documents/discharge-summaries:
    post:
      summary: Generate and store a discharge summary PDF
      operationId: create_discharge_summary
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DischargeSummaryRequest' }
      responses:
        '201':
          description: Discharge summary PDF (application/pdf, X-Document-Id header)
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /api/v1/documents/medical-certificates:
    post:
      summary: Generate and store a medical certificate PDF
      operationId: create_medical_certificate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MedicalCertificateRequest' }
      responses:
        '201':
          description: Medical certificate PDF (application/pdf, X-Document-Id header)
          content:
            application/pdf:
              schema: { type: string, format: binary }
  /api/v1/documents/ocr:
    post:
      summary: Extract text from an uploaded document via OCR
      operationId: ocr_document
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '200':
          description: Extracted text and metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OcrResponse' }
        '422': { description: Upload failed validation, or OCR is unavailable }
  /api/v1/documents/{document_id}/download:
    get:
      summary: Download a stored document's file content
      operationId: download_document
      parameters: [{ $ref: '#/components/parameters/DocumentId' }]
      responses:
        '200':
          description: File content (binary, media type per stored content_type)
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '404': { description: Document or stored file not found }
  /api/v1/documents/{document_id}:
    get:
      summary: Get document metadata, or download the file if download=true
      operationId: get_document
      parameters:
        - { $ref: '#/components/parameters/DocumentId' }
        - name: download
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Document metadata, or the binary file when download=true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentResponse' }
            application/pdf:
              schema: { type: string, format: binary }
        '404': { description: Document not found }
components:
  parameters:
    DocumentId:
      name: document_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    InvoiceLine:
      type: object
      required: [description, quantity, unit_price]
      properties:
        description: { type: string, minLength: 1, maxLength: 500 }
        quantity: { type: number, exclusiveMinimum: 0 }
        unit_price: { type: number, minimum: 0 }
    InvoiceRequest:
      type: object
      required: [invoice_number, patient_name, patient_id, issued_at, lines]
      properties:
        invoice_number: { type: string, minLength: 1, maxLength: 128 }
        patient_name: { type: string, minLength: 1, maxLength: 200 }
        patient_id: { type: string, minLength: 1, maxLength: 64 }
        issued_at: { type: string, format: date-time }
        currency: { type: string, default: "USD", maxLength: 8 }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/InvoiceLine' }
        insurer_share: { type: number, minimum: 0, default: 0 }
        patient_share: { type: number, minimum: 0, default: 0 }
    DischargeSummaryRequest:
      type: object
      required: [patient_name, patient_id, admission_date, discharge_date, diagnosis, follow_up_instructions]
      properties:
        patient_name: { type: string, minLength: 1, maxLength: 200 }
        patient_id: { type: string, minLength: 1, maxLength: 64 }
        admission_date: { type: string, format: date }
        discharge_date: { type: string, format: date, description: "Must not be before admission_date" }
        diagnosis: { type: string, minLength: 1, maxLength: 2000 }
        medications:
          type: array
          items: { type: string }
        follow_up_instructions: { type: string, minLength: 1, maxLength: 4000 }
        attending_physician: { type: string, maxLength: 200, nullable: true }
        encounter_id: { type: string, maxLength: 128, nullable: true }
    MedicalCertificateRequest:
      type: object
      required: [patient_name, patient_id, diagnosis, rest_days, physician]
      properties:
        patient_name: { type: string, minLength: 1, maxLength: 200 }
        patient_id: { type: string, minLength: 1, maxLength: 64 }
        diagnosis: { type: string, minLength: 1, maxLength: 2000 }
        rest_days: { type: integer, minimum: 0, maximum: 365 }
        physician: { type: string, minLength: 1, maxLength: 200 }
        issue_date: { type: string, format: date }
        start_date: { type: string, format: date, nullable: true }
        end_date: { type: string, format: date, nullable: true }
    DocumentResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        doc_type: { type: string, enum: [INVOICE, DISCHARGE_SUMMARY, MEDICAL_CERTIFICATE] }
        reference: { type: string, nullable: true }
        filename: { type: string }
        content_type: { type: string }
        size: { type: integer }
        sha256: { type: string }
        created_at: { type: string, format: date-time, nullable: true }
        stored: { type: boolean }
        download_url: { type: string }
    OcrResponse:
      type: object
      properties:
        filename: { type: string }
        content_type: { type: string }
        size: { type: integer }
        text: { type: string }
        character_count: { type: integer }

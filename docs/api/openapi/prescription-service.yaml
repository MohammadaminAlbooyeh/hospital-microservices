openapi: 3.0.3
info:
  title: prescription-service
  description: >
    Prescribing, dosage, and drug-interaction checks (the interaction check
    itself is delegated to a Python rule/ML service internally; the
    interaction warnings are surfaced on the prescription response).
  version: "1.0.0"
servers:
  - url: http://localhost:8088
  - url: http://localhost:8080
    description: Via api-gateway (/api/v1/prescriptions/**)
paths:
  /api/v1/prescriptions:
    post:
      summary: Issue a prescription
      operationId: issue
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IssuePrescriptionRequest' }
      responses:
        '201':
          description: Prescription issued (interactionWarnings populated if any)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrescriptionResponse' }
    get:
      summary: Search prescriptions
      operationId: search
      parameters:
        - name: patientId
          in: query
          schema: { type: string, format: uuid }
        - name: encounterId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Matching prescriptions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PrescriptionResponse' }
  /api/v1/prescriptions/{id}:
    get:
      summary: Get a prescription by ID
      operationId: get
      parameters: [{ $ref: '#/components/parameters/PrescriptionId' }]
      responses:
        '200':
          description: Prescription
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrescriptionResponse' }
        '404': { description: Prescription not found }
  /api/v1/prescriptions/{id}/dispense:
    post:
      summary: Mark a prescription as dispensed
      operationId: dispense
      parameters: [{ $ref: '#/components/parameters/PrescriptionId' }]
      responses:
        '200':
          description: Dispensed prescription
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrescriptionResponse' }
  /api/v1/prescriptions/{id}/cancel:
    post:
      summary: Cancel a prescription
      operationId: cancel
      parameters: [{ $ref: '#/components/parameters/PrescriptionId' }]
      responses:
        '200':
          description: Cancelled prescription
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PrescriptionResponse' }
components:
  parameters:
    PrescriptionId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    PrescriptionStatus:
      type: string
      enum: [ISSUED, DISPENSED, CANCELLED]
    PrescriptionItemRequest:
      type: object
      required: [drugCode, drugName]
      properties:
        drugCode: { type: string }
        drugName: { type: string }
        dose: { type: string, nullable: true }
        frequency: { type: string, nullable: true }
        durationDays: { type: integer, minimum: 1, nullable: true }
        instructions: { type: string, nullable: true }
    IssuePrescriptionRequest:
      type: object
      required: [patientId, doctorId, items]
      properties:
        patientId: { type: string, format: uuid }
        encounterId: { type: string, format: uuid, nullable: true }
        doctorId: { type: string, format: uuid }
        notes: { type: string, nullable: true }
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PrescriptionItemRequest' }
    PrescriptionItemResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        drugCode: { type: string }
        drugName: { type: string }
        dose: { type: string, nullable: true }
        frequency: { type: string, nullable: true }
        durationDays: { type: integer, nullable: true }
        instructions: { type: string, nullable: true }
    InteractionWarning:
      type: object
      properties:
        drugA: { type: string }
        drugB: { type: string }
        severity: { type: string }
        description: { type: string }
    PrescriptionResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        encounterId: { type: string, format: uuid, nullable: true }
        doctorId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/PrescriptionStatus' }
        notes: { type: string, nullable: true }
        issuedAt: { type: string, format: date-time, nullable: true }
        items:
          type: array
          items: { $ref: '#/components/schemas/PrescriptionItemResponse' }
        interactionWarnings:
          type: array
          items: { $ref: '#/components/schemas/InteractionWarning' }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

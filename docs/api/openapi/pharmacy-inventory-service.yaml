openapi: 3.0.3
info:
  title: pharmacy-inventory-service
  description: >
    Stock levels, dispensing, low-stock alerts, expiry tracking. Consumes
    PaymentFailed to release reservations or reconcile already-dispensed
    stock (return-to-stock or write-off).
  version: "1.0.0"
servers:
  - url: http://localhost:8090
  - url: http://localhost:8080
    description: Via api-gateway (/api/v1/pharmacy/**, /api/v1/stock/**)
paths:
  /api/v1/pharmacy/stock:
    post:
      summary: Receive stock (creates or upserts a drug by code)
      operationId: receiveStock
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StockUpsertRequest' }
      responses:
        '200':
          description: Upserted drug stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrugResponse' }
    get:
      summary: List all drugs in stock
      operationId: listStock
      responses:
        '200':
          description: All drugs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DrugResponse' }
  /api/v1/pharmacy/stock/low:
    get:
      summary: List drugs at or below reorder level
      operationId: lowStock
      responses:
        '200':
          description: Low-stock drugs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DrugResponse' }
  /api/v1/pharmacy/stock/expiring:
    get:
      summary: List drugs expiring within N days
      operationId: expiring
      parameters:
        - name: days
          in: query
          schema: { type: integer, default: 30 }
      responses:
        '200':
          description: Expiring drugs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DrugResponse' }
  /api/v1/pharmacy/stock/{code}:
    get:
      summary: Get a drug's stock by code
      operationId: getStock
      parameters:
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Drug stock
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DrugResponse' }
        '404': { description: Drug not found }
  /api/v1/pharmacy/dispense:
    post:
      summary: Dispense a prescribed drug (idempotent; decrements stock)
      operationId: dispense
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DispenseRequest' }
      responses:
        '200':
          description: Dispense record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DispenseResponse' }
  /api/v1/pharmacy/dispense/{id}:
    get:
      summary: Get a dispense record by ID
      operationId: getDispense
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Dispense record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DispenseResponse' }
        '404': { description: Dispense record not found }
components:
  schemas:
    DispenseStatus:
      type: string
      enum: [RESERVED, DISPENSED, RETURNED, WRITTEN_OFF]
    StockUpsertRequest:
      type: object
      required: [code, name, unitPrice, quantity, reorderLevel]
      properties:
        code: { type: string }
        name: { type: string }
        form: { type: string, nullable: true }
        unit: { type: string, nullable: true }
        unitPrice: { type: number, format: double, minimum: 0 }
        quantity: { type: integer, minimum: 0 }
        reorderLevel: { type: integer, minimum: 0 }
        expiryDate: { type: string, format: date, nullable: true }
    DrugResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        form: { type: string, nullable: true }
        unit: { type: string, nullable: true }
        unitPrice: { type: number, format: double }
        quantityOnHand: { type: integer }
        reorderLevel: { type: integer }
        expiryDate: { type: string, format: date, nullable: true }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    DispenseRequest:
      type: object
      required: [patientId, drugCode, quantity]
      properties:
        patientId: { type: string, format: uuid }
        encounterId: { type: string, format: uuid, nullable: true }
        prescriptionId: { type: string, format: uuid, nullable: true }
        drugCode: { type: string }
        quantity: { type: integer, minimum: 1 }
    DispenseResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        idempotencyKey: { type: string }
        patientId: { type: string, format: uuid }
        encounterId: { type: string, format: uuid, nullable: true }
        prescriptionId: { type: string, format: uuid, nullable: true }
        drugCode: { type: string }
        quantity: { type: integer }
        status: { $ref: '#/components/schemas/DispenseStatus' }
        finalizedAt: { type: string, format: date-time, nullable: true }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

openapi: 3.0.3
info:
  title: encounter-service
  description: >
    The visit as a first-class entity, modelled as an explicit state machine:
    SCHEDULED -> CHECKED_IN -> IN_CONSULTATION -> PENDING_LAB/PENDING_PHARMACY
    -> READY_FOR_DISCHARGE -> COMPLETED (terminal), with CANCELLED/NO_SHOW as
    terminal side branches. See docs/architecture.md §5.6.
  version: "1.0.0"
servers:
  - url: http://localhost:8086
  - url: http://localhost:8080
    description: Via api-gateway (/api/v1/encounters/**)
paths:
  /api/v1/encounters:
    post:
      summary: Create an encounter (state = SCHEDULED/CHECKED_IN on creation)
      operationId: create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateEncounterRequest' }
      responses:
        '201':
          description: Encounter created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EncounterResponse' }
    get:
      summary: Search encounters
      operationId: search
      parameters:
        - name: patientId
          in: query
          schema: { type: string, format: uuid }
        - name: doctorId
          in: query
          schema: { type: string, format: uuid }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/EncounterState' }
      responses:
        '200':
          description: Matching encounters
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/EncounterResponse' }
  /api/v1/encounters/{id}:
    get:
      summary: Get an encounter by ID
      operationId: get
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Encounter
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EncounterResponse' }
        '404': { description: Encounter not found }
  /api/v1/encounters/{id}/check-in:
    post:
      summary: Transition SCHEDULED -> CHECKED_IN
      operationId: checkIn
      parameters: [{ $ref: '#/components/parameters/EncounterId' }]
      responses:
        '200':
          description: Updated encounter
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EncounterResponse' }
        '409': { description: INVALID_ENCOUNTER_TRANSITION }
  /api/v1/encounters/{id}/start:
    post:
      summary: Transition CHECKED_IN -> IN_CONSULTATION
      operationId: start
      parameters: [{ $ref: '#/components/parameters/EncounterId' }]
      responses:
        '200':
          description: Updated encounter
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EncounterResponse' }
        '409': { description: INVALID_ENCOUNTER_TRANSITION }
  /api/v1/encounters/{id}/labs:
    post:
      summary: Transition IN_CONSULTATION -> PENDING_LAB
      operationId: labs
      parameters: [{ $ref: '#/components/parameters/EncounterId' }]
      responses:
        '200':
          description: Updated encounter
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EncounterResponse' }
        '409': { description: INVALID_ENCOUNTER_TRANSITION }
  /api/v1/encounters/{id}/pharmacy:
    post:
      summary: Transition IN_CONSULTATION -> PENDING_PHARMACY
      operationId: pharmacy
      parameters: [{ $ref: '#/components/parameters/EncounterId' }]
      responses:
        '200':
          description: Updated encounter
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EncounterResponse' }
        '409': { description: INVALID_ENCOUNTER_TRANSITION }
  /api/v1/encounters/{id}/complete:
    post:
      summary: Transition READY_FOR_DISCHARGE -> COMPLETED; emits EncounterCompleted
      operationId: complete
      parameters: [{ $ref: '#/components/parameters/EncounterId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompleteEncounterRequest' }
      responses:
        '200':
          description: Completed encounter
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EncounterResponse' }
        '409': { description: INVALID_ENCOUNTER_TRANSITION }
  /api/v1/encounters/{id}/cancel:
    post:
      summary: Cancel an encounter (terminal state CANCELLED)
      operationId: cancel
      parameters: [{ $ref: '#/components/parameters/EncounterId' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelEncounterRequest' }
      responses:
        '200':
          description: Cancelled encounter
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EncounterResponse' }
        '409': { description: INVALID_ENCOUNTER_TRANSITION }
components:
  parameters:
    EncounterId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    EncounterState:
      type: string
      enum:
        - SCHEDULED
        - CHECKED_IN
        - IN_CONSULTATION
        - PENDING_LAB
        - PENDING_PHARMACY
        - READY_FOR_DISCHARGE
        - COMPLETED
        - NO_SHOW
        - CANCELLED
    CreateEncounterRequest:
      type: object
      required: [patientId]
      properties:
        patientId: { type: string, format: uuid }
        doctorId: { type: string, format: uuid, nullable: true }
        departmentId: { type: string, format: uuid, nullable: true }
        chiefComplaint: { type: string, nullable: true }
    CompleteEncounterRequest:
      type: object
      required: [diagnoses]
      properties:
        diagnoses:
          type: array
          minItems: 1
          items: { type: string }
    CancelEncounterRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    EncounterResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        patientId: { type: string, format: uuid }
        doctorId: { type: string, format: uuid, nullable: true }
        departmentId: { type: string, format: uuid, nullable: true }
        state: { $ref: '#/components/schemas/EncounterState' }
        chiefComplaint: { type: string, nullable: true }
        checkedInAt: { type: string, format: date-time, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        cancelledAt: { type: string, format: date-time, nullable: true }
        cancelReason: { type: string, nullable: true }
        diagnoses:
          type: array
          items: { type: string }
        version: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

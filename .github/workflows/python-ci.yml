name: Python CI

on:
  push:
    branches: [main]
    paths:
      - "services-python/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "services-python/**"
      - ".github/workflows/python-ci.yml"

jobs:
  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - analytics-service
          - audit-service
          - document-service
          - insurance-service
          - ml-prediction-service
          - notification-service
          - triage-service
    defaults:
      run:
        working-directory: services-python/${{ matrix.service }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install shared library
        run: pip install ../shared

      - name: Install service with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

  build-shared:
    name: Build shared library
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services-python/shared
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # hospital-shared has no standalone test suite of its own; it is
      # exercised indirectly by every service's test job above. This job
      # only verifies the package installs and imports cleanly.
      - name: Install package
        run: pip install .

      - name: Import sanity check
        run: python -c "import hospital_shared"

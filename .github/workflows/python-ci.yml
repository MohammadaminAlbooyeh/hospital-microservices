name: Python CI

on:
  push:
    branches: [main]
    paths:
      - "services-python/**"
      - ".github/workflows/python-ci.yml"
  pull_request:
    paths:
      - "services-python/**"
      - ".github/workflows/python-ci.yml"

jobs:
  test:
    name: Test (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - analytics-service
          - audit-service
          - document-service
          - insurance-service
          - ml-prediction-service
          - notification-service
          - triage-service
    defaults:
      run:
        working-directory: services-python/${{ matrix.service }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: services-python/${{ matrix.service }}/.venv
          key: poetry-${{ runner.os }}-${{ matrix.service }}-${{ hashFiles(format('services-python/{0}/poetry.lock', matrix.service)) }}
          restore-keys: |
            poetry-${{ runner.os }}-${{ matrix.service }}-

      - name: Configure Poetry to use in-project venv
        run: poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest

  test-shared:
    name: Test shared library
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services-python/shared
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest

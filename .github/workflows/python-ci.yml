name: python-ci
on:
  push:
    paths: ['services-python/**', '.github/workflows/python-ci.yml']
  pull_request:
    paths: ['services-python/**']
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [analytics-service, document-service, insurance-service, notification-service, triage-service, audit-service, ml-prediction-service]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and test
        working-directory: services-python/${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then pip install -e '.[dev]' || pip install -e .; fi
          if [ -d tests ]; then python -m pytest -q; else echo "no tests"; fi

name: hospital-platform

# Full local stack: infra (via `include`) + every microservice that currently
# has a Dockerfile, plus the patient-portal frontend.
#
# Usage: make up  (== docker compose up -d --build)
#
# NOTE: audit-service, ml-prediction-service and notification-service are
# intentionally left out for now — see the root README / task notes; their
# Dockerfiles exist but expose ports that don't match .env.example / the k8s
# ConfigMap yet (e.g. audit-service EXPOSEs 8004, clashing with
# analytics-service, instead of 8007; notification-service EXPOSEs 8002,
# clashing with insurance-service, instead of 8003). Add them back once that
# is reconciled.

include:
  - docker-compose.infra.yml

x-java-env: &java-env
  SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USER: ${POSTGRES_USER:-hospital}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-hospital}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
  KAFKA_TOPIC: ${KAFKA_TOPIC:-hospital.events}
  EUREKA_URL: ${EUREKA_URL:-http://config-discovery-service:8888/eureka/}
  EUREKA_ENABLED: ${EUREKA_ENABLED:-true}
  CONFIG_SERVER_URL: ${CONFIG_SERVER_URL:-http://config-discovery-service:8888}
  JWT_SECRET: ${JWT_SECRET}
  INSURANCE_SERVICE_URL: ${INSURANCE_SERVICE_URL:-http://insurance-service:8002}
  PRESCRIPTION_SERVICE_URL: ${PRESCRIPTION_SERVICE_URL:-http://prescription-service:8088}
  DOCUMENT_SERVICE_URL: ${DOCUMENT_SERVICE_URL:-http://document-service:8006}
  ML_SERVICE_URL: ${ML_SERVICE_URL:-http://ml-prediction-service:8005}

x-python-env: &python-env
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
  KAFKA_TOPIC: ${KAFKA_TOPIC:-hospital.events}
  KAFKA_CONSUMER_ENABLED: "true"
  JWT_SECRET: ${JWT_SECRET}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  # ---------------------------------------------------------------------
  # Edge & infrastructure services (Java)
  # ---------------------------------------------------------------------
  config-discovery-service:
    build:
      context: .
      dockerfile: services-java/config-discovery-service/Dockerfile
    env_file: .env
    environment:
      <<: *java-env
      SERVER_PORT: 8888
    ports:
      - "8888:8888"
    networks: [hospital-net]
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: services-java/auth-service/Dockerfile
    env_file: .env
    environment:
      <<: *java-env
      SERVER_PORT: 8081
      DB_NAME: hospital_auth
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-hospital}
    ports:
      - "${AUTH_PORT:-8081}:8081"
    networks: [hospital-net]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started
      config-discovery-service:
        condition: service_started

  api-gateway:
    build:
      context: .
      dockerfile: services-java/api-gateway/Dockerfile
    env_file: .env
    environment:
      <<: *java-env
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    networks: [hospital-net]
    depends_on:
      - auth-service
      - config-discovery-service

  # ---------------------------------------------------------------------
  # Patient core domain (Java, + triage in Python)
  # ---------------------------------------------------------------------
  patient-service:
    build:
      context: .
      dockerfile: services-java/patient-service/Dockerfile
    env_file: .env
    environment:
      <<: *java-env
      SERVER_PORT: 8082
      DB_NAME: hospital_patient
    ports:
      - "${PATIENT_PORT:-8082}:8082"
    networks: [hospital-net]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-discovery-service:
        condition: service_started

  appointment-service:
    build:
      context: .
      dockerfile: services-java/appointment-service/Dockerfile
    env_file: .env
    environment:
      <<: *java-env
      SERVER_PORT: 8083
      DB_NAME: hospital_appointment
    ports:
      - "${APPOINTMENT_PORT:-8083}:8083"
    networks: [hospital-net]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-discovery-service:
        condition: service_started

  doctor-service:
    build:
      context: .
      dockerfile: services-java/doctor-service/Dockerfile
    env_file: .env
    environment:
      <<: *java-env
      SERVER_PORT: 8084
      DB_NAME: hospital_doctor
    ports:
      - "${DOCTOR_PORT:-8084}:8084"
    networks: [hospital-net]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-discovery-service:
        condition: service_started

  department-service:
    build:
      context: .
      dockerfile: services-java/department-service/Dockerfile
    env_file: .env
    environment:
      <<: *java-env
      SERVER_PORT: 8085
      DB_NAME: hospital_department
    ports:
      - "${DEPARTMENT_PORT:-8085}:8085"
    networks: [hospital-net]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-discovery-service:
        condition: service_started

  triage-service:
    build:
      context: .
      dockerfile: services-python/triage-service/Dockerfile
    env_file: .env
    environment:
      <<: *python-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hospital}:${POSTGRES_PASSWORD:-hospital}@postgres:5432/hospital_triage
    ports:
      - "${TRIAGE_PORT:-8001}:8001"
    networks: [hospital-net]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # Clinical workflow (Java)
  # ---------------------------------------------------------------------
  encounter-service:
    build:
      context: .
      dockerfile: services-java/encounter-service/Dockerfile
    env_file: .env
    environment:
      <<: *java-env
      SERVER_PORT: 8086
      DB_NAME: hospital_encounter
    ports:
      - "${ENCOUNTER_PORT:-8086}:8086"
    networks: [hospital-net]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-discovery-service:
        condition: service_started

  ehr-service:
    build:
      context: .
      dockerfile: services-java/ehr-service/Dockerfile
    env_file: .env
    environment:
      <<: *java-env
      SERVER_PORT: 8087
      DB_NAME: hospital_ehr
    ports:
      - "${EHR_PORT:-8087}:8087"
    networks: [hospital-net]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-discovery-service:
        condition: service_started

  prescription-service:
    build:
      context: .
      dockerfile: services-java/prescription-service/Dockerfile
    env_file: .env
    environment:
      <<: *java-env
      SERVER_PORT: 8088
      DB_NAME: hospital_prescription
    ports:
      - "${PRESCRIPTION_PORT:-8088}:8088"
    networks: [hospital-net]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-discovery-service:
        condition: service_started

  lab-service:
    build:
      context: .
      dockerfile: services-java/lab-service/Dockerfile
    env_file: .env
    environment:
      <<: *java-env
      SERVER_PORT: 8089
      DB_NAME: hospital_lab
    ports:
      - "${LAB_PORT:-8089}:8089"
    networks: [hospital-net]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-discovery-service:
        condition: service_started

  pharmacy-inventory-service:
    build:
      context: .
      dockerfile: services-java/pharmacy-inventory-service/Dockerfile
    env_file: .env
    environment:
      <<: *java-env
      SERVER_PORT: 8090
      DB_NAME: hospital_pharmacy
    ports:
      - "${PHARMACY_PORT:-8090}:8090"
    networks: [hospital-net]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-discovery-service:
        condition: service_started

  # ---------------------------------------------------------------------
  # Financial (Java + Python)
  # ---------------------------------------------------------------------
  billing-service:
    build:
      context: .
      dockerfile: services-java/billing-service/Dockerfile
    env_file: .env
    environment:
      <<: *java-env
      SERVER_PORT: 8091
      DB_NAME: hospital_billing
    ports:
      - "${BILLING_PORT:-8091}:8091"
    networks: [hospital-net]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-discovery-service:
        condition: service_started

  payment-service:
    build:
      context: .
      dockerfile: services-java/payment-service/Dockerfile
    env_file: .env
    environment:
      <<: *java-env
      SERVER_PORT: 8092
      DB_NAME: hospital_payment
    ports:
      - "${PAYMENT_PORT:-8092}:8092"
    networks: [hospital-net]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      config-discovery-service:
        condition: service_started

  insurance-service:
    build:
      context: .
      dockerfile: services-python/insurance-service/Dockerfile
    env_file: .env
    environment:
      <<: *python-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hospital}:${POSTGRES_PASSWORD:-hospital}@postgres:5432/hospital_insurance
    ports:
      - "${INSURANCE_PORT:-8002}:8002"
    networks: [hospital-net]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # Intelligence & supporting services (Python)
  #
  # analytics-service, document-service: Dockerfiles exist and are consistent
  # with .env.example, so they're included. audit-service, ml-prediction-service
  # and notification-service are deliberately SKIPPED here — see the note at
  # the top of this file.
  # ---------------------------------------------------------------------
  analytics-service:
    build:
      context: .
      dockerfile: services-python/analytics-service/Dockerfile
    env_file: .env
    environment:
      <<: *python-env
      DATABASE_URL: postgresql+asyncpg://${TIMESCALE_USER:-hospital}:${TIMESCALE_PASSWORD:-hospital}@timescaledb:5432/${TIMESCALE_DB:-hospital_analytics}
    ports:
      - "${ANALYTICS_PORT:-8004}:8004"
    networks: [hospital-net]
    depends_on:
      timescaledb:
        condition: service_healthy
      kafka:
        condition: service_healthy

  document-service:
    build:
      context: .
      dockerfile: services-python/document-service/Dockerfile
    env_file: .env
    environment:
      <<: *python-env
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-hospital}:${POSTGRES_PASSWORD:-hospital}@postgres:5432/hospital_document
    ports:
      - "${DOCUMENT_PORT:-8006}:8006"
    networks: [hospital-net]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------
  patient-portal:
    build:
      context: ./frontend/patient-portal
      dockerfile: Dockerfile
    environment:
      VITE_API_URL: ${PATIENT_PORTAL_API_URL:-http://localhost:8080}
    ports:
      - "3000:80"
    networks: [hospital-net]
    depends_on:
      - api-gateway
